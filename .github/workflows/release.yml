name: Release

# 打 tag（v*）时自动交叉编译四个平台的独立二进制并发布 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "手动构建时使用的版本号，例如 v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: miro-linux-amd64
          - target: bun-linux-arm64
            asset: miro-linux-arm64
          - target: bun-darwin-x64
            asset: miro-darwin-amd64
          - target: bun-darwin-arm64
            asset: miro-darwin-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test
        run: bun test

      - name: Build
        run: bun run scripts/build.js --target ${{ matrix.target }} --outfile dist/${{ matrix.asset }}

      - name: Package
        run: |
          chmod +x dist/${{ matrix.asset }}
          tar -czf dist/${{ matrix.asset }}.tar.gz -C dist ${{ matrix.asset }}
          shasum -a 256 dist/${{ matrix.asset }}.tar.gz > dist/${{ matrix.asset }}.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
